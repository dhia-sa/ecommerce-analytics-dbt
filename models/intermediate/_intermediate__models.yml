version: 2

models:
  - name: int_order_payments_pivoted
    description: One row per order with total paid and amount by payment method.
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_order_reviews_deduplicated
    description: Exactly one review per order (the most recently answered one).
    columns:
      - name: order_id
        data_tests: [unique, not_null]

  - name: int_order_items_enriched
    description: Order items with English product category and seller location.
    columns:
      - name: product_category
        data_tests: [not_null]
