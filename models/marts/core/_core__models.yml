version: 2

models:
  - name: fct_orders
    description: One row per order with value, payment, delivery and review metrics.
    columns:
      - name: order_id
        description: Primary key.
        data_tests: [unique, not_null]
      - name: customer_unique_id
        description: The real customer; joins to dim_customers.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_unique_id
      - name: order_date
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: is_valid_order
        description: False for canceled and unavailable orders. Use this to filter revenue metrics.
      - name: order_value
        description: Item prices plus freight.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: delivery_days
        description: Days from purchase to delivery to the customer.
      - name: days_vs_estimate
        description: Delivery date minus estimated date in days. Negative means delivered early.
      - name: is_late_delivery
        description: True when delivered after the estimated date. Null if not delivered.

  - name: fct_order_items
    description: One row per item in an order.
    columns:
      - name: order_item_key
        description: Surrogate key of order_id + order_item_id.
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
      - name: seller_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_id

  - name: dim_customers
    description: One row per real customer (customer_unique_id), with latest location and order history.
    columns:
      - name: customer_unique_id
        data_tests: [unique, not_null]
      - name: lifetime_orders
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 1

  - name: dim_products
    description: One row per product, with English category name.
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: product_category
        data_tests: [not_null]

  - name: dim_sellers
    description: One row per seller, with location and sales activity.
    columns:
      - name: seller_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar dimension from 2016 to 2018.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
