name: ecommerce_analytics
version: "1.0.0"
config-version: 2

profile: ecommerce_analytics

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]

clean-targets: ["target", "dbt_packages"]

vars:
  # Folder holding the raw Olist CSVs (relative to the project root)
  raw_data_path: "data/raw"
  # Olist data is sparse before 2017 and after Aug 2018; analytics marts use this window
  analysis_start_date: "2017-01-01"
  analysis_end_date: "2018-08-31"

models:
  ecommerce_analytics:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      core:
        +schema: core
      analytics:
        +schema: analytics
